name: wifi_drop
description: "A fast, private, cross-platform local Wi-Fi file sharing app with radar UI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  crypto: ^3.0.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  device_info_plus: ^10.0.0
  network_info_plus: ^5.0.0
  http: ^1.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
