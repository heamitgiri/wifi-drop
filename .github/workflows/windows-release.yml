name: Build Windows 11 Release EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Platform Scaffolding
        run: flutter create --platforms=windows,android .

      - name: Doctor Check
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Flutter Windows Release
        id: flutter_build
        continue-on-error: true
        run: flutter build windows --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Integration Tests
        run: python -m unittest discover -s tests -v

      - name: Build Standalone PyInstaller Executable
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onedir --windowed --add-data "p2p_app;p2p_app" --name "WiFiDrop" p2p_engine.py

      - name: Package Windows Release Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path "release_dist"
          if (Test-Path "build\windows\x64\runner\Release\WiFiDrop.exe") {
            Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "release_dist\" -Recurse -Force
          } elseif (Test-Path "dist\WiFiDrop\WiFiDrop.exe") {
            Copy-Item -Path "dist\WiFiDrop\*" -Destination "release_dist\" -Recurse -Force
          }
          Copy-Item -Path "START_WIFIDROP.bat" -Destination "release_dist\" -Force
          Copy-Item -Path "START_P2P_MESH.bat" -Destination "release_dist\" -Force
          Copy-Item -Path "README.md" -Destination "release_dist\" -Force

          Compress-Archive -Path "release_dist\*" -DestinationPath "WiFiDrop-Windows-x64.zip" -Force
          Get-FileHash -Algorithm SHA256 "WiFiDrop-Windows-x64.zip" > "WiFiDrop-Windows-x64.zip.sha256"
          Get-Content "WiFiDrop-Windows-x64.zip.sha256"

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiDrop-Windows-x64
          path: |
            WiFiDrop-Windows-x64.zip
            WiFiDrop-Windows-x64.zip.sha256
          retention-days: 14
