name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Scaffolding
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation -- --init-script android/init.gradle

      - name: Generate Checksum
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiDrop-Android-Debug-APK
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            app-debug.apk.sha256
          retention-days: 14
